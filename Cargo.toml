[package]
name = "lr2021"
version = "0.14.0"
edition = "2024"
license = "MIT"
description = "Driver for Semtech LR2021"
repository = "https://github.com/TheClams/lr2021"
readme = "Readme.md"
categories = ["embedded", "no-std"]
keywords = ["driver", "LR2021", "transceiver"]

[features]
# Forwarded to embassy-time rather than selected unconditionally on it, so that a
# `defmt` build still gets `Format` for the durations and instants in this API while a
# build without the feature is not made to link defmt at all.
#
# `defmt-timestamp-uptime` is deliberately not forwarded: it installs the global defmt
# timestamp, which is the application's to choose and can only be chosen once.
defmt = ["dep:defmt", "embassy-time/defmt"]
# Enable 2.4Ghz RF path (LR2021/LR2022)
rf2g4 = []
# Enable Adavanced FSK like FLRC/Zigbee/ZWave (LR2021)
fskadv = []
# Default correspond to LR2021
default = ["rf2g4","fskadv"]

[dependencies]

# No features selected here. `tick-hz-*` and `defmt` are global choices that belong to the
# application: cargo unifies features across the whole graph, so selecting one here forces
# it on every crate in the build. `tick-hz-32_768` in particular cannot merely be
# overridden — it conflicts outright with any HAL time driver that asks for a different
# rate, and the build then fails inside embassy-time-driver with a duplicate `TICK_HZ`
# rather than anywhere that names this crate.
#
# Nothing here depends on the tick rate; the driver uses `Duration`, `Instant` and `Timer`,
# which are rate-independent. An application that wants 32_768 Hz still selects it, and one
# whose HAL wants 1_000_000 Hz can now use this driver at all.
embassy-time = { version = "0.5.0" }
embassy-embedded-hal = { version = "0.5.0" }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0"

defmt = { version = "1.0.1", optional = true }

# Disable test when running all target to avoid issue with rust-analyzer
[lib]
test = false
doctest = false
bench = false